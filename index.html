<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Display Jadwal, Spek Senjata & Kendaraan Live</title>

<!-- Konfigurasi PWA In-line -->
<link rel="manifest" href='data:application/manifest+json,{"name":"Display Pameran & Jadwal","short_name":"Display Slog","start_url":"./index.html","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/3652/3652191.png","sizes":"512x512","type":"image/png"}]}'>
<meta name="theme-color" content="#0f172a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(circle at 10% 20%, #0f172a 0%, #020617 90%);
  color: #f8fafc; display: flex; flex-direction: column; position: relative;
}

header {
  background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px);
  padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0;
}

.logo-title h1 {
  font-size: 1.6rem; font-weight: 800; letter-spacing: 1.5px;
  background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase;
}

.datetime-container {
  text-align: right; background: rgba(30, 41, 59, 0.5);
  padding: 8px 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex; align-items: center; gap: 15px;
}

#clock { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: #38bdf8; }

.header-btns { display: flex; gap: 8px; }

.btn-setting {
  background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: #f8fafc;
  border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 14px; border-radius: 10px;
  cursor: pointer; font-weight: 600; font-size: 0.85rem;
}

.btn-weapon {
  background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); color: #ffffff;
  border: 1px solid rgba(248, 113, 113, 0.3); padding: 8px 14px; border-radius: 10px;
  cursor: pointer; font-weight: 700; font-size: 0.85rem;
}

.btn-vehicle {
  background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #ffffff;
  border: 1px solid rgba(251, 191, 36, 0.3); padding: 8px 14px; border-radius: 10px;
  cursor: pointer; font-weight: 700; font-size: 0.85rem;
}

main { flex: 1; padding: 20px 30px; display: flex; flex-direction: column; overflow: hidden; }

.table-container {
  width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px);
  border-radius: 20px; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.08);
}

table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
th { position: sticky; top: 0; background: rgba(30, 41, 59, 0.95); color: #38bdf8; padding: 16px 15px; }
td { padding: 14px 15px; color: #e2e8f0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

/* POPUP MODAL STYLES */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.display-modal {
  background: #0f172a; width: 90%; max-width: 750px; border-radius: 24px;
  padding: 25px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
}

.weapon-theme { border: 2px solid #ef4444; }
.vehicle-theme { border: 2px solid #f59e0b; }

.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
.modal-header h2 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }

.item-select {
  width: 100%; padding: 10px; background: #1e293b; border: 1px solid #475569;
  color: #38bdf8; font-weight: 700; border-radius: 8px; margin-bottom: 15px;
}

.specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 0.9rem; }
.spec-card { background: #1e293b; padding: 10px 14px; border-radius: 10px; }
.weapon-card { border-left: 3px solid #ef4444; }
.vehicle-card { border-left: 3px solid #f59e0b; }
.spec-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
.spec-val { font-weight: 700; color: #f8fafc; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

#tizenAudioUnlocker {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 6, 23, 0.96);
  z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
}
</style>
</head>
<body>

<div id="tizenAudioUnlocker">
  <h1 style="font-size: 2rem; margin-bottom: 15px; color: #38bdf8;">DISPLAY PAMERAN & MONITORING LIVE</h1>
  <button onclick="bukaKunciAudioTizen()" style="padding: 16px 36px; font-size: 1.2rem; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 14px; cursor: pointer;">
    🔊 AKTIFKAN TAMPILAN LIVE
  </button>
</div>

<header>
  <div class="logo-title">
    <h1>DISPLAY PAMERAN & JADWAL LIVE</h1>
  </div>
  <div class="datetime-container">
    <div id="clock">00:00</div>
    <div class="header-btns">
      <button class="btn-vehicle" onclick="toggleVehicleModal(true)">🚛 Spek Kendaraan</button>
      <button class="btn-weapon" onclick="toggleWeaponModal(true)">🎯 Spek Senjata</button>
      <button class="btn-setting" onclick="toggleModal(true)">➕ Agenda</button>
    </div>
  </div>
</header>

<main>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Waktu</th>
          <th>Nama Kegiatan</th>
          <th>Pimpinan</th>
          <th>Lokasi</th>
        </tr>
      </thead>
      <tbody id="main-table-body">
        <tr><td colspan="4" style="text-align: center;">Memuat Data...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- POPUP SPEK SENJATA -->
<div class="modal-overlay" id="weaponModal">
  <div class="display-modal weapon-theme">
    <div class="modal-header">
      <h2 style="color: #f87171;">🎯 DISPLAY TEKNIS SENJATA & ALPAL</h2>
      <button onclick="toggleWeaponModal(false)" style="background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer;">✕</button>
    </div>
    
    <select class="item-select" id="selectWeapon" onchange="renderWeaponData()">
      <option value="verba">MANPADS 9K333 VERBA</option>
      <option value="xtraim">THALES XTRAIM THERMAL SIGHT</option>
      <option value="konus">NVG B-5-21 / KONUS</option>
    </select>

    <div class="specs-grid" id="weaponSpecsContainer"></div>
  </div>
</div>

<!-- POPUP SPEK KENDARAAN (FITUR BARU) -->
<div class="modal-overlay" id="vehicleModal">
  <div class="display-modal vehicle-theme">
    <div class="modal-header">
      <h2 style="color: #fbbf24;">🚛 DISPLAY KENDARAAN OPERASIONAL & TAKTIS</h2>
      <button onclick="toggleVehicleModal(false)" style="background:none; border:none; color:#94a3b8; font-size:1.5rem; cursor:pointer;">✕</button>
    </div>
    
    <select class="item-select" id="selectVehicle" onchange="renderVehicleData()">
      <option value="canter">MITSUBISHI CANTER EURO 4 (ANGKUT PERSONEL/LOGISTIK)</option>
      <option value="calya">TOYOTA CALYA (OPERASIONAL STAF)</option>
    </select>

    <div class="specs-grid" id="vehicleSpecsContainer"></div>
  </div>
</div>

<script>
// Database Data Spek Senjata
const weaponDatabase = {
  verba: {
    "Tipe Sistem": "MANPADS 9K333 Verba",
    "Kaliber Proyektil": "72 mm",
    "Jarak Tembak Efektif": "500 m - 6.000 m",
    "Ketinggian Sasaran": "10 m - 3.500 m",
    "Sistem Pemandu": "3-Channel Optical (UV, Near-IR, Mid-IR)",
    "Kecepatan Target Max": "400 m/s"
  },
  xtraim: {
    "Nama Alat": "Thales XTRAIM Thermal Sight",
    "Tipe Optik": "Day / Thermal Decoupled Sight",
    "Sensor Inti": "Uncooled Infrared (LWIR)",
    "Pembesaran Optik": "1x (Digital Zoom 2x / 4x)",
    "Bobot Total": "< 800 gram",
    "Dudukan Rail": "Picatinny Rail (MIL-STD-1913)"
  },
  konus: {
    "Nama Alat": "NVG B-5-21 / Konus",
    "Kategori": "Night Vision Goggles",
    "Generasi Tabung": "Gen 2+ / Gen 3 System",
    "Sudut Pandang (FOV)": "40° Wide Angle",
    "Daya Tahan Baterai": "Hingga 40 Jam (AA / CR123A)",
    "Berat Unit": "450 gram"
  }
};

// Database Data Spek Kendaraan Operasional
const vehicleDatabase = {
  canter: {
    "Model Unit": "Mitsubishi Fuso Canter Euro 4",
    "Fungsi Utis": "Angkut Personel / Logistik Pasukan",
    "Kapasitas Angkut": "20 - 25 Personel Bersenjata Lengkap",
    "Spesifikasi Mesin": "4V21-2AT1 (Common Rail Turbo Intercooler)",
    "Standar Emisi": "Euro 4 Exhaust Gas Recirculation (EGR)",
    "Kapasitas Beban Max": "7.5 Ton GVW"
  },
  calya: {
    "Model Unit": "Toyota Calya Operasional",
    "Fungsi Utis": "Kendaraan Dinas / Dukungan Logistik Ringan",
    "Tipe Mesin": "1.2L NR-VE Dual VVT-i (4 Silinder)",
    "Kapasitas Penumpang": "7 Personel (3 Baris Kursi)",
    "Sistem Lampu": "LED Multi-Reflector Headlamp",
    "Karakteristik Operasional": "Efisiensi Bahan Bakar Tinggi & Lincah"
  }
};

function renderWeaponData() {
  const selectedKey = document.getElementById('selectWeapon').value;
  const data = weaponDatabase[selectedKey];
  const container = document.getElementById('weaponSpecsContainer');

  let html = '';
  for (let [key, val] of Object.entries(data)) {
    html += `
      <div class="spec-card weapon-card">
        <div class="spec-label">${key}</div>
        <div class="spec-val">${val}</div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function renderVehicleData() {
  const selectedKey = document.getElementById('selectVehicle').value;
  const data = vehicleDatabase[selectedKey];
  const container = document.getElementById('vehicleSpecsContainer');

  let html = '';
  for (let [key, val] of Object.entries(data)) {
    html += `
      <div class="spec-card vehicle-card">
        <div class="spec-label">${key}</div>
        <div class="spec-val">${val}</div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function toggleWeaponModal(show) {
  document.getElementById('weaponModal').classList.toggle('active', show);
  if(show) renderWeaponData();
}

function toggleVehicleModal(show) {
  document.getElementById('vehicleModal').classList.toggle('active', show);
  if(show) renderVehicleData();
}

function bukaKunciAudioTizen() {
  document.getElementById('tizenAudioUnlocker').style.display = 'none';
}

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}

setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
